<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerea Travel | احجز رحلتك</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f3a">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fa;color:#172033;transition:background .3s,color .3s}
header{background:#0b1f3a;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{font-size:26px;font-weight:bold;color:#d9b45b}
.logo img{height:115px;width:auto;object-fit:contain;display:block}
nav a{color:#fff;text-decoration:none;margin-right:20px}
.darkToggle{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-right:15px}
.hero{min-height:420px;padding:70px 7%;background:linear-gradient(135deg,#0b1f3a,#176b87);color:#fff;text-align:center}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{font-size:19px;margin-bottom:35px}
.search-box{max-width:980px;margin:auto;background:#fff;padding:20px;border-radius:15px;display:grid;grid-template-columns:1.4fr 1fr .7fr .7fr auto;gap:10px;align-items:end;text-align:right;box-shadow:0 10px 30px rgba(0,0,0,.2)}
input,select{padding:13px;border:1px solid #ddd;border-radius:8px;width:100%;background:#fff;color:#172033}
button{border:none;border-radius:8px;padding:14px 20px;background:#d9b45b;color:#0b1f3a;font-weight:bold;cursor:pointer}
.section{padding:55px 7%}
.section h2{text-align:center;margin-bottom:20px;font-size:30px}
.trips{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.card:hover{transform:translateY(-3px)}
.card-img{height:180px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(135deg,#65c7f7,#0052d4) center/cover;position:relative}
.card-img .badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold}
.card-img .meal-badge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#f5a623,#ff9500);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold;max-width:70%}
.card-img .meal-badge.included{background:linear-gradient(135deg,#28a745,#1e7e34)}
.card-content{padding:20px}
.card-content h3{margin-bottom:8px}
.card-content p{margin-bottom:12px;color:#555}
.price{color:#176b87;font-size:20px;font-weight:bold;margin:12px 0}
.card button{width:100%}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center}
.feature{background:#fff;padding:30px 20px;border-radius:15px}
.feature-icon{font-size:40px;margin-bottom:15px}
footer{background:#0b1f3a;color:#fff;text-align:center;padding:30px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);justify-content:center;align-items:center;z-index:1000;overflow:auto}
.modal-box{background:#fff;width:92%;max-width:520px;max-height:92vh;overflow:auto;padding:25px;border-radius:15px}
.modal-box input,.modal-box select{margin-bottom:10px}
.close{float:left;font-size:28px;cursor:pointer}
.himg{height:160px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,#65c7f7,#0052d4) center/cover}
.info{background:#f0f6fa;padding:10px;border-radius:8px;margin-bottom:10px;font-size:14px}
label{display:block;font-size:13px;margin:4px 0;color:#555}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0}
.chk input{width:auto;margin:0}
.total{font-size:20px;font-weight:bold;color:#176b87;margin:10px 0}
.note{text-align:center;color:#777;grid-column:1/-1}
.wa{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;font-weight:bold;padding:14px;border-radius:8px;margin-top:15px}
@media(max-width:800px){.search-box,.trips,.features{grid-template-columns:1fr}.hero h1{font-size:32px}nav{display:none}header{justify-content:center;padding:14px 7%}.logo img{height:150px}.darkToggle{position:absolute;top:14px;left:14px;margin:0}}
.gal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:3000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:15px}#galMain{max-width:100%;max-height:68vh;border-radius:10px}.gthumbs{display:flex;gap:6px;overflow:auto}.gthumbs img{height:56px;border-radius:6px;opacity:.55;cursor:pointer}.gthumbs img.on{opacity:1;outline:2px solid #d9b45b}.gnav{display:flex;gap:14px;align-items:center;color:#fff}.gnav button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:10px 18px;border-radius:50%;font-size:20px;cursor:pointer}.gx{position:absolute;top:12px;left:18px;color:#fff;font-size:34px;cursor:pointer;background:transparent;padding:0}
.fab{position:fixed;bottom:22px;left:22px;background:#0b1f3a;color:#fff;border:none;border-radius:30px;padding:14px 22px;font-weight:bold;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:500;font-size:15px}
.fab:hover{background:#176b87}
.stBox{background:#f0f6fa;padding:14px;border-radius:10px;margin-bottom:12px;white-space:pre-line;font-size:14px;line-height:1.7}
.stBadge{display:inline-block;padding:6px 14px;border-radius:20px;color:#fff;font-weight:bold;font-size:14px}
.payBox{background:#fff3cd;padding:15px;border-radius:10px;margin-top:12px;border-right:4px solid #e0a800}
.payBox p{margin:6px 0;font-size:14px}

.mealBox{padding:14px 16px;border-radius:12px;margin-bottom:12px;font-size:14px;display:flex;align-items:flex-start;gap:12px}
.mealBox.included{background:linear-gradient(135deg,#d4edda,#a8e6b5);border-right:4px solid #28a745;color:#155724}
.mealBox.available{background:linear-gradient(135deg,#fff8e1,#ffe4a1);border-right:4px solid #f5a623;color:#856404}
.mealBox .mIcon{font-size:28px;line-height:1}
.mealBox .mContent b{display:block;margin-bottom:4px;font-size:15px}
.mealBox .mContent small{font-size:12px;opacity:.85}
.mealBox .mContent .mealList{font-weight:600;margin-top:4px;display:block}

.depInfo{background:linear-gradient(135deg,#e3f2fd,#bbdefb);padding:10px 14px;border-radius:8px;margin:8px 0;font-size:13px;border-right:4px solid #176b87;color:#0d47a1;font-weight:bold}

/* Vehicle options */
.vehicleOptions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vehicleOpt{padding:14px;background:#fff;border:2px solid #e5e9f0;border-radius:10px;cursor:pointer;text-align:center;transition:all .2s ease;font-size:14px;font-weight:600;color:#172033}
.vehicleOpt:hover{border-color:#176b87;background:#f0f6fa}
.vehicleOpt.selected{border-color:#176b87;background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#0d47a1}
.vehicleOpt .vIcon{font-size:24px;display:block;margin-bottom:4px}
.vehicleOpt .vPrice{display:block;font-size:12px;color:#666;margin-top:4px;font-weight:normal}
.vehicleOpt.selected .vPrice{color:#0d47a1;font-weight:bold}

.filtersBar{background:#fff;border-radius:12px;padding:14px;margin-bottom:22px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px}
.filtersBar label{font-size:12px;margin-bottom:4px;display:block;color:#666;font-weight:bold}
.resultCount{text-align:center;color:#666;margin-bottom:18px;font-size:14px}
.resultCount b{color:#176b87}
.clearFilters{background:#dc3545;color:#fff;padding:8px 14px;font-size:12px;margin-top:6px;width:100%}

.stars{display:inline-flex;gap:2px;color:#ddd;font-size:16px}
.stars .on{color:#f5a623}
.rating{display:flex;align-items:center;gap:6px;font-size:13px;color:#666;margin-bottom:6px}
.rating b{color:#172033;font-size:15px}
.reviewItem{padding:12px;border-bottom:1px solid #eee}
.reviewItem:last-child{border-bottom:none}
.reviewItem .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reviewItem .name{font-weight:bold;font-size:14px}
.reviewItem .date{font-size:11px;color:#999}
.reviewItem .comment{font-size:13px;color:#555;line-height:1.6}
.reviewCard{background:#f9fafb;border-radius:10px;padding:10px 14px;margin-top:12px}
.reviewCard h4{margin-bottom:8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mapsBtn{display:inline-block;background:#4285f4;color:#fff;text-decoration:none;font-weight:bold;padding:10px 16px;border-radius:8px;margin-top:10px;font-size:14px}
.reviewForm{background:#f9fafb;border-radius:10px;padding:14px;margin-top:12px}
.ratingInput{display:flex;gap:6px;font-size:30px;cursor:pointer;justify-content:center;margin:10px 0}
.ratingInput span{color:#ddd;transition:color .15s}
.ratingInput span.on{color:#f5a623}
.reviewForm textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;min-height:70px;font-family:inherit;margin-top:8px}
.reviewBtn{display:block;width:100%;margin-top:12px;background:#f5a623;color:#fff;font-weight:bold;padding:12px;border-radius:8px;cursor:pointer;border:none;font-size:14px}

.couponRow{display:flex;gap:8px;margin-top:8px}
.couponRow input{margin:0;flex:1}
.couponRow button{padding:13px 18px;background:#0b1f3a;color:#fff;white-space:nowrap;font-size:14px}
.couponMsg{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:6px;display:none}
.couponMsg.ok{display:block;background:#d4edda;color:#155724}
.couponMsg.err{display:block;background:#f8d7da;color:#721c24}
.discountBox{background:#d4edda;color:#155724;padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px;font-weight:bold;display:none;border-right:4px solid #28a745}
.discountBox.show{display:block}

.uploadBtn{display:block;text-align:center;background:#25d366;color:#fff;font-weight:bold;padding:14px;border-radius:8px;cursor:pointer;margin-top:12px}
.uploadBtn.loading{background:#ffc107;color:#333;cursor:wait}
.proofPreview{margin-top:12px;text-align:center}
.proofPreview img{max-width:100%;max-height:250px;border-radius:10px;border:2px solid #28a745}

.cancelBtn{display:block;width:100%;margin-top:10px;background:#dc3545;color:#fff;font-weight:bold;padding:12px;border-radius:8px;cursor:pointer;border:none;font-size:14px}

#toastBox{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:90%}
.toast{background:#fff;padding:14px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:14px;font-weight:bold;min-width:220px;border-right:5px solid #176b87;animation:slideIn .3s ease}
.toast.ok{border-color:#28a745;background:#d4edda;color:#155724}
.toast.err{border-color:#dc3545;background:#f8d7da;color:#721c24}
.toast.info{border-color:#176b87;background:#e3f2fd;color:#0d47a1}

body.dark{background:#0f172a;color:#e2e8f0}
body.dark .card,body.dark .feature,body.dark .modal-box,body.dark input,body.dark select,body.dark .filtersBar,body.dark .vehicleOpt{background:#1e293b;color:#e2e8f0;border-color:#334155}
body.dark .info,body.dark .stBox{background:#1e293b;color:#cbd5e1}
body.dark .card-content p,body.dark label{color:#94a3b8}
body.dark .section h2{color:#e2e8f0}
body.dark .price,body.dark .total{color:#5eb8d6}
body.dark .mealBox.included{background:linear-gradient(135deg,#14532d,#166534);color:#bbf7d0}
body.dark .mealBox.available{background:linear-gradient(135deg,#3a2f0f,#4a3a15);color:#ffe4a1}
body.dark .depInfo{background:linear-gradient(135deg,#1e3a5f,#2a4a6f);color:#bbdefb}
body.dark .vehicleOpt.selected{background:linear-gradient(135deg,#1e3a5f,#2a4a6f);color:#bbdefb;border-color:#5eb8d6}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}
</style>
</head>
