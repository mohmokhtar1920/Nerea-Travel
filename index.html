<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nerea Travel | احجز رحلتك</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #d9b45b;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }

    .hero {
      min-height: 470px;
      padding: 80px 7%;
      background: linear-gradient(135deg, #0b1f3a, #176b87);
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 35px;
    }

    .search-box {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .search-box input,
    .search-box select {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 100%;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      background: #d9b45b;
      color: #0b1f3a;
      font-weight: bold;
      cursor: pointer;
    }

    .section {
      padding: 55px 7%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 30px;
    }

    .trips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card-img {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      background: linear-gradient(135deg, #65c7f7, #0052d4);
    }

    .card-content {
      padding: 20px;
    }

    .card-content h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #176b87;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .card button {
      width: 100%;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: center;
    }

    .feature {
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
    }
