<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nerea Travel | لوحة التحكم</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fa;color:#172033}
header{background:#0b1f3a;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:#d9b45b}
button{border:none;border-radius:8px;padding:10px 16px;background:#d9b45b;color:#0b1f3a;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
input,select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%}
#login{max-width:360px;margin:80px auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
#login input{margin-bottom:12px}
#app{display:none;padding:20px 5%}
.bar{display:flex;gap:10px;margin-bottom:18px;align-items:center}
.bar select{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.07);border-right:5px solid #999}
.card h3{margin-bottom:8px}
.card p{font-size:14px;margin:4px 0;color:#444}
.price{font-size:18px;font-weight:bold;color:#176b87;margin:8px 0}
.call{background:#fff3cd;padding:6px 8px;border-radius:6px;font-size:13px;margin:6px 0}
.card a{color:#176b87;font-weight:bold;text-decoration:none;margin-left:10px}
.editBtn{width:100%;margin-top:10px;background:#0b1f3a;color:#fff}
.s-Pending{border-color:#e0a800}
.s-Confirmed{border-color:#17a2b8}
.s-Paid{border-color:#28a745}
.s-Cancelled{border-color:#dc3545}
.s-Waiting{border-color:#fd7e14}
#msg{color:#c00;margin-bottom:10px;font-size:14px}

/* Edit modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modalBox{
  background:#fff;
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:18px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.modalHeader h2{margin:0}
.modalHeader button{
  border:0;
  background:transparent;
  color:#172033;
  font-size:30px;
  cursor:pointer;
  padding:0 8px;
}
.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.formGrid label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}
.formGrid input,
.formGrid select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
}
.modalActions{
  display:flex;
  gap:10px;
  margin-top:25px;
}
.modalActions button{
  padding:12px 25px;
}
.cancelBtn{background:#ddd;color:#172033}

@media(max-width:600px){
  .formGrid{grid-template-columns:1fr}
  .bar{flex-wrap:wrap}
  .bar select{max-width:none}
}
.adminPanel{display:none;background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.07)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:#eee;color:#172033}.tabs button.active{background:#0b1f3a;color:#fff}.adminForm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}.adminForm .full{grid-column:1/-1}.tableWrap{overflow:auto}.simpleTable{width:100%;border-collapse:collapse}.simpleTable th,.simpleTable td{padding:9px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.danger{background:#dc3545;color:#fff}.secondary{background:#ddd;color:#172033}.roleBadge{background:#d9b45b;color:#0b1f3a;padding:5px 9px;border-radius:15px;font-size:12px}@media(max-width:600px){.adminForm{grid-template-columns:1fr}}
.follow{margin-top:10px;padding-top:10px;border-top:1px dashed #ccc}.follow select,.follow textarea{width:100%;margin:6px 0;padding:9px;border:1px solid #ddd;border-radius:8px;font-family:inherit}.follow small{color:#777;display:block;margin-top:6px}
.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:15px 0}.ph img{width:100%;height:100px;object-fit:cover;border-radius:8px}.ph button{width:100%;margin-top:4px;padding:6px}
</style>
</head>

<header>
  <div class="logo">Nerea Travel | لوحة التحكم <span id="roleBadge" class="roleBadge" style="display:none"></span></div>

<div id="adminPanel" class="adminPanel"><h2>⚙️ إدارة الموقع — Admin فقط</h2><div class="tabs"><button class="active" onclick="showTab('hotels',this)">الفنادق</button><button onclick="showTab('trips',this)">الرحلات</button><button onclick="showTab('destinations',this)">الوجهات</button><button onclick="showTab('points',this)">نقاط التحرك</button><button onclick="showTab('staff',this);loadStaff()">👥 الموظفون</button></div><div id="tab-hotels"><button onclick="newHotel()">➕ إضافة فندق</button><div id="hotelForm" class="adminForm" style="display:none"><input type="hidden" id="aHotelId"><input id="aHotelName" placeholder="اسم الفندق"><select id="aHotelDest"></select><select id="aHotelSeries"><option value="false">Non-Series</option><option value="true">Series</option></select><input id="aSingle" type="number" placeholder="Single"><input id="aDouble" type="number" placeholder="Double"><input id="aTriple" type="number" placeholder="Triple"><input id="aNight" type="number" placeholder="سعر الليلة"><input id="aChildAge" type="number" placeholder="سن الطفل"><input id="aSeatPrice" type="number" placeholder="سعر الكرسي"><input class="full" id="aImage" placeholder="رابط الصورة"><input class="full" id="aDesc" placeholder="الوصف"><button onclick="saveHotel()">حفظ</button><button class="secondary" onclick="cancelHotel()">إلغاء</button></div><div class="tableWrap"><table class="simpleTable"><thead><tr><th>الفندق</th><th>الوجهة</th><th>النوع</th><th>إجراء</th></tr></thead><tbody id="hotelRows"></tbody></table></div></div><div id="tab-trips" style="display:none"><button onclick="newTrip()">➕ إضافة رحلة</button><div id="tripForm" class="adminForm" style="display:none"><input type="hidden" id="aTripId"><select id="aTripHotel"></select><select id="aTripDay"><option>Thursday</option><option>Sunday</option></select><input type="date" id="aTripStart"><input type="date" id="aTripEnd"><input type="number" id="aTripNights" placeholder="الليالي"><input type="number" id="aTripPrice" placeholder="سعر الفرد"><input type="number" id="aTripSingle" placeholder="Single"><input type="number" id="aTripChild" placeholder="سعر الطفل"><input type="number" id="aTripChildAge" value="10" placeholder="سن الطفل"><input type="number" id="aTripSeat" placeholder="سعر الكرسي"><input type="number" id="aTripRooms" placeholder="الغرف"><input type="number" id="aTripSeats" placeholder="المقاعد"><button onclick="saveTrip()">حفظ</button><button class="secondary" onclick="cancelTrip()">إلغاء</button></div><div class="tableWrap"><table class="simpleTable"><thead><tr><th>الفندق</th><th>اليوم</th><th>التاريخ</th><th>السعر</th><th>إجراء</th></tr></thead><tbody id="tripRows"></tbody></table></div></div><div id="tab-destinations" style="display:none"><button onclick="newDest()">➕ إضافة وجهة</button><div id="destForm" class="adminForm" style="display:none"><input type="hidden" id="aDestId"><input id="aDestName" placeholder="اسم الوجهة"><input id="aDestImage" placeholder="رابط الصورة"><input class="full" id="aDestDesc" placeholder="الوصف"><button onclick="saveDest()">حفظ</button><button class="secondary" onclick="cancelDest()">إلغاء</button></div><div class="tableWrap"><table class="simpleTable"><tbody id="destRows"></tbody></table></div></div><div id="tab-points" style="display:none"><button onclick="newPoint()">➕ إضافة نقطة تحرك</button><div id="pointForm" class="adminForm" style="display:none"><input type="hidden" id="aPointId"><input id="aPointName" placeholder="اسم نقطة التحرك"><input type="number" id="aPointPrice" placeholder="السعر الإضافي"><button onclick="savePoint()">حفظ</button><button class="secondary" onclick="cancelPoint()">إلغاء</button></div><div class="tableWrap"><table class="simpleTable"><tbody id="pointRows"></tbody></table></div></div><div id="tab-staff" style="display:none"><button onclick="loadStaff()">تحديث</button><div class="tableWrap"><table class="simpleTable"><thead><tr><th>الموظف</th><th>الدور</th><th>آخر دخول</th><th>آخر نشاط</th><th>الحالة</th></tr></thead><tbody id="staffRows"></tbody></table></div><h3 style="margin:15px 0 8px">سجل الدخول (آخر 50)</h3><div class="tableWrap"><table class="simpleTable"><tbody id="loginRows"></tbody></table></div></div></div>

<div id="photoModal" class="modal"><div class="modalBox">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://saqgyyedcemfszzqbgtu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Zl0kQG2MndgtgDsfGI6qMg_F-8vt7iB";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const $ = id => document.getElementById(id);

const ST = [
  "Pending Confirmation",
  "Waiting Confirmation",
  "Confirmed",
  "Waiting Payment",
  "Paid",
  "Cancelled"
];

let rows = [];
let hotels = {};
let editingId = null;
let hb=null,role=null,userEmail="",destinations=[],adminHotels=[],trips=[],departurePoints=[];

const esc = v =>
  String(v ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

const cls = s => "s-" + String(s || "").split(" ")[0];

$("filter").innerHTML += ST
  .map(s => `<option value="${esc(s)}">${esc(s)}</option>`)
  .join("");

async function start(){const {data,error}=await db.auth.getSession();if(error)console.error(error);const ok=!!data.session;$('login').style.display=ok?'none':'block';$('app').style.display=ok?'block':'none';$('outBtn').style.display=ok?'block':'none';if(!ok)return;const uid=data.session.user.id;const p=await db.from("staff_profiles").select("role").eq("user_id",uid).maybeSingle();if(p.error||!p.data){alert("هذا الحساب غير مسجل كموظف");await db.auth.signOut();return;}role=p.data.role;await ping(window.justLogged);window.justLogged=false;clearInterval(hb);hb=setInterval(()=>ping(false),60000);userEmail=data.session.user.email||"";$('roleBadge').style.display='inline-block';$('roleBadge').innerText=role==='admin'?'Admin':'خدمة العملاء';$('adminPanel').style.display=role==='admin'?'block':'none';await loadAll();if(role==='admin')await loadAdminData();}

async function login(){
  $("msg").innerText = "";

  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("pass").value
  });

  if(error){
    $("msg").innerText = "الإيميل أو كلمة السر غير صحيحة";
    return;
  }

  window.justLogged = true;
  await start();
}

async function logout(){
  clearInterval(hb);
  const u=(await db.auth.getUser()).data.user;
  if(u) await db.from("staff_activity").update({last_seen:null}).eq("user_id",u.id);
  await db.auth.signOut();
  await start();
}

async function loadAll(){

  /* Load all hotels with their real names */
  const h = await db
    .from("Hotels")
    .select("id, Name")
    .order("Name", { ascending:true });

  if(h.error){
    console.error(h.error);
    alert("تعذر تحميل أسماء الفنادق: " + h.error.message);
    return;
  }

  hotels = {};

  (h.data || []).forEach(x => {
    hotels[String(x.id)] = x.Name || "بدون اسم";
  });

  const dp=await db.from("departure_points").select("*").order("name"); if(dp.error){alert(dp.error.message);return;} departurePoints=dp.data||[];

  /* Load bookings */
  const r = await db
    .from("bookings")
    .select("*")
    .order("created_at", { ascending:false });

  if(r.error){
    console.error(r.error);
    alert("تعذر تحميل الحجوزات. تأكد من صلاحيات القراءة.");
    return;
  }

  rows = r.data || [];

  render();
}

function render(){

  const f = $("filter").value;

  const list = f
    ? rows.filter(x => x.status === f)
    : rows;

  $("count").innerText = list.length + " حجز";

  $("list").innerHTML =
    list.map(b => {

      const wa = String(b.customer_phone || "")
        .replace(/\D/g,"")
        .replace(/^0/,"20");

      const hotelName =
        hotels[String(b.hotel_id)] || "غير محدد";

      const tripType =
        b.Series_Trips_id
          ? "Series"
          : "Non-Series";

      return `
        <div class="card ${cls(b.status)}">

          <h3>#${esc(b.id)} - ${esc(b.customer_name)}</h3>

          <p>
            🏨 ${esc(hotelName)}
            • ${tripType}
          </p>

          <p>📅 ${esc(b.check_in || "-")} ← ${esc(b.check_out || "-")}</p>
          <p>🌙 عدد الليالي: <b>${nightsOf(b)}</b></p>

          <p>
            👥 ${esc(b.adults ?? b.number_of_people ?? 0)} كبار
            ${b.children ? " + " + esc(b.children) + " أطفال" : ""}
            • 🛏 ${esc(b.number_of_rooms || 0)} غرفة
            ${esc(b.room_type || "")}
          </p>

          <p>📍 مكان التحرك: <b>${esc((departurePoints.find(x=>String(x.id)===String(b.departure_points_id))||{}).name||"—")}</b></p>
          <p>🗓 تاريخ التحرك: <b>${depDate(b)}</b></p>
          <p>🚌 ${Number(b.bus_seats||0)>0?esc(b.bus_seats)+" كراسي":"بدون انتقالات"}</p>

          <div class="price">
            ${Number(b.total_price || 0).toLocaleString()} جنيه
          </div>

          ${
            b.customer_service_call
              ? `<div class="call">
                   📞 يريد مكالمة (${esc(b.preferred_call_time || "")})
                 </div>`
              : ""
          }

          <p>
            <a href="tel:${esc(b.customer_phone)}">اتصال</a>
            <a href="https://wa.me/${wa}" target="_blank">واتساب</a>
            ${esc(b.customer_phone)}
          </p>

          ${paymentHtml(b)}${actionsHtml(b)}${followHtml(b)}

        </div>
      `;

    }).join("") || "<p>لا توجد حجوزات</p>";
}

async function setStatus(id,status){

  const r = await db
    .from("bookings")
    .update({status})
    .eq("id",id);

  if(r.error){
    console.error(r.error);
    alert("تعذر تغيير الحالة");
    return;
  }

  const booking = rows.find(x => x.id == id);

  if(booking){
    booking.status = status;
  }

  render();
}

/* =========================
   EDIT BOOKING
========================= */

function editBooking(id){

  const b = rows.find(x => x.id == id);

  if(!b){
    alert("الحجز غير موجود");
    return;
  }

  editingId = id;

  $("eName").value = b.customer_name || "";
  $("ePhone").value = b.customer_phone || "";

  $("eCheckIn").value = b.check_in || "";
  $("eCheckOut").value = b.check_out || "";

  $("eAdults").value = Number(b.adults ?? 1);
  $("eChildren").value = Number(b.children ?? 0);

  $("eRooms").value = Number(b.number_of_rooms ?? 1);

  $("eRoomType").value =
    b.room_type || "Double";

  $("eSeats").value =
    Number(b.bus_seats ?? 0);

  $("eTotal").value =
    Number(b.total_price ?? 0);

  $("eDeparture").innerHTML=`<option value="">بدون انتقالات</option>`+departurePoints.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(b.departure_points_id)?"selected":""}>${esc(x.name)} (+${Number(x.extra_price||0).toLocaleString()} جنيه)</option>`).join("");

  /* Fill hotel select */
  const hotelSelect = $("eHotel");

  const hotelOptions = Object.entries(hotels);

  if(hotelOptions.length === 0){

    hotelSelect.innerHTML =
      `<option value="">لا توجد فنادق</option>`;

  }else{

    hotelSelect.innerHTML =
      hotelOptions.map(([id,name]) => {

        const selected =
          String(id) === String(b.hotel_id)
            ? "selected"
            : "";

        return `
          <option value="${esc(id)}" ${selected}>
            ${esc(name)}
          </option>
        `;

      }).join("");

  }

  /* IMPORTANT: open the modal */
  $("editModal").style.display = "flex";
}

function closeEdit(){

  editingId = null;

  $("editModal").style.display = "none";
}

async function saveEdit(){

  if(!editingId){
    alert("لم يتم اختيار حجز");
    return;
  }

  const name =
    $("eName").value.trim();

  const phone =
    $("ePhone").value.trim();

  const hotelId =
    Number($("eHotel").value);

  const adults =
    Number($("eAdults").value) || 0;

  const children =
    Number($("eChildren").value) || 0;

  const rooms =
    Number($("eRooms").value) || 1;

  const seats =
    Number($("eSeats").value) || 0;

  const total =
    Number($("eTotal").value) || 0;

  if(!name){
    alert("اكتب اسم العميل");
    return;
  }

  if(!phone){
    alert("اكتب رقم الهاتف");
    return;
  }

  if(!hotelId){
    alert("اختر الفندق");
    return;
  }

  if(adults < 1){
    alert("عدد البالغين يجب أن يكون 1 على الأقل");
    return;
  }

  const updateData = {

    customer_name: name,

    customer_phone: phone,

    hotel_id: hotelId,
    departure_points_id: $("eDeparture").value ? Number($("eDeparture").value) : null,

    check_in:
      $("eCheckIn").value || null,

    check_out:
      $("eCheckOut").value || null,

    adults: adults,

    children: children,

    number_of_people:
      adults + children,

    number_of_rooms:
      rooms,

    room_type:
      $("eRoomType").value,

    bus_seats:
      seats,

    total_price:
      total
  };

  const { error } = await db
    .from("bookings")
    .update(updateData)
    .eq("id",editingId);

  if(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء حفظ التعديل:\n" +
      error.message
    );

    return;
  }

  alert("تم تعديل الحجز بنجاح ✅");

  closeEdit();

  await loadAll();
}

async function renderPhotos(){const r=await db.from("hotel_images").select("*").eq("hotel_id",photoHotel).order("id");if(r.error){alert(r.error.message);return;}$("photoGrid").innerHTML=(r.data||[]).map(p=>`<div class="ph"><img src="${esc(p.url)}"><button class="danger" onclick="delPhoto(${p.id})">حذف</button></div>`).join("")||"<p>لا توجد صور</p>";}
function resizeImg(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),"image/jpeg",0.85);URL.revokeObjectURL(img.src);};img.onerror=()=>res(file);img.src=URL.createObjectURL(file);});}
async function uploadPhotos(){
  const files=[...$("photoFiles").files];if(!files.length){alert("اختر صور أولاً");return;}
  $("upBtn").disabled=true;$("upBtn").innerText="جاري الرفع...";
  for(const f of files){
    const blob=await resizeImg(f);
    const path=photoHotel+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
    const up=await db.storage.from("hotel-images").upload(path,blob,{contentType:"image/jpeg"});
    if(up.error){alert("تعذر رفع صورة: "+up.error.message);continue;}
    const url=db.storage.from("hotel-images").getPublicUrl(path).data.publicUrl;
    const ins=await db.from("hotel_images").insert({hotel_id:photoHotel,url,path});
    if(ins.error){alert(ins.error.message);continue;}
    const h=adminHotels.find(x=>x.id==photoHotel);
    if(h&&!h.image_url){await db.from("Hotels").update({image_url:url}).eq("id",photoHotel);h.image_url=url;}
  }
  $("photoFiles").value="";$("upBtn").disabled=false;$("upBtn").innerText="رفع الصور";await renderPhotos();
}
async function delPhoto(id){
  if(!confirm("حذف الصورة؟"))return;
  const r=await db.from("hotel_images").select("*").eq("id",id).maybeSingle();
  if(r.data){
    if(r.data.path)await db.storage.from("hotel-images").remove([r.data.path]);
    await db.from("hotel_images").delete().eq("id",id);
    const h=adminHotels.find(x=>x.id==photoHotel);
    if(h&&h.image_url===r.data.url){const n=await db.from("hotel_images").select("url").eq("hotel_id",photoHotel).order("id").limit(1);const nu=(n.data&&n.data[0])?n.data[0].url:"";await db.from("Hotels").update({image_url:nu}).eq("id",photoHotel);h.image_url=nu;}
  }
  await renderPhotos();
}

    if(el.classList.contains("full")){w.className="full";el.classList.remove("full");}
