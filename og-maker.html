<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>OG Image Maker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', 'Tahoma', sans-serif; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #333;
    padding: 20px;
  }
  .og-canvas {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #0b1f3a 0%, #176b87 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  /* زخرفة خلفية */
  .og-canvas::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: rgba(217, 180, 91, 0.08);
    border-radius: 50%;
  }
  .og-canvas::after {
    content: '';
    position: absolute;
    bottom: -150px;
    left: -100px;
    width: 500px;
    height: 500px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 50%;
  }
  .og-logo {
    height: 220px;
    width: auto;
    max-width: 70%;
    object-fit: contain;
    margin-bottom: 30px;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.3));
  }
  .og-title {
    font-size: 52px;
    font-weight: bold;
    color: #d9b45b;
    margin-bottom: 16px;
    z-index: 2;
    text-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .og-tagline {
    font-size: 30px;
    color: #ffffff;
    opacity: 0.95;
    z-index: 2;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .og-footer {
    position: absolute;
    bottom: 35px;
    display: flex;
    align-items: center;
    gap: 20px;
    color: #ffffff;
    opacity: 0.85;
    font-size: 20px;
    z-index: 2;
  }
  .og-footer .dot {
    width: 6px;
    height: 6px;
    background: #d9b45b;
    border-radius: 50%;
  }
  .og-plane {
    position: absolute;
    top: 40px;
    left: 60px;
    font-size: 60px;
    opacity: 0.15;
    transform: rotate(-15deg);
    z-index: 1;
  }
</style>
</head>
<body>

<div class="og-canvas" id="ogCanvas">
  <div class="og-plane">✈️</div>
  <img src="logo.png" alt="Nerea Travel" class="og-logo" onerror="this.style.display='none';document.getElementById('fallbackTitle').style.fontSize='90px'">
  <h1 class="og-title" id="fallbackTitle">Nerea Travel</h1>
  <p class="og-tagline">رحلتك تبدأ من هنا ✈️</p>
  <div class="og-footer">
    <span>nereatravel.com</span>
    <span class="dot"></span>
    <span>احجز الآن</span>
  </div>
</div>

</body>
</html>
